<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Password Forge</title>
  <meta name="description" content="Generates a strong, repeatable password for each site from a passphrase using PBKDF2. Nothing sensitive is ever stored.">
  <meta name="theme-color" content="#1a1b20">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="lang-toggle" id="langToggle">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">JA</button>
      </div>
      <div class="title-wrapper">
        <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <h1>Password Forge</h1>
      </div>
      <p class="subtitle" data-i18n="subtitle">Stateless Brass Cipher</p>
    </header>

    <div class="panel">
      <!-- マスター合言葉 -->
      <div class="input-group">
        <label for="masterKey" data-i18n="labelMasterKey">Master Key (Passphrase)</label>
        <div class="password-wrapper">
          <input type="password" id="masterKey" data-i18n-placeholder="placeholderMasterKey" placeholder="A secret phrase only you remember" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button id="toggleVis" tabindex="-1">👁️</button>
        </div>
      </div>

      <!-- 対象ドメインと世代 -->
      <div class="row">
        <div class="input-group flex-grow">
          <label for="domain" data-i18n="labelDomain">Target Site (Domain)</label>
          <input type="text" id="domain" placeholder="example.com" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="input-group version-group">
          <label for="version" data-i18n="labelVersion">Gen</label>
          <input type="number" id="version" min="1" value="1" inputmode="numeric">
        </div>
      </div>

      <!-- ユーザーID -->
      <div class="input-group">
        <label for="userId" data-i18n="labelUserId">User ID</label>
        <div class="password-wrapper">
          <input type="text" id="userId" data-i18n-placeholder="placeholderUserId" placeholder="e.g. your.email@example.com" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button id="saveUserIdBtn" tabindex="-1" data-i18n-title="saveUserIdTitle" title="Save as default">💾</button>
        </div>
        <p class="hint" id="userIdHint"></p>
      </div>

      <!-- パスワード長 -->
      <div class="input-group">
        <label>
          <span data-i18n="labelLength">Password Length</span>:
          <span id="lengthDisplay" class="gold-text">16</span>
          <span data-i18n="lengthUnit">chars</span>
        </label>
        <input type="range" id="lengthSlider" min="8" max="32" value="16">
      </div>

      <!-- 文字種オプション -->
      <div class="options-grid">
        <label class="checkbox-label"><input type="checkbox" id="optUpper" checked> <span data-i18n="optUpper">Uppercase</span> (A-Z)</label>
        <label class="checkbox-label"><input type="checkbox" id="optLower" checked> <span data-i18n="optLower">Lowercase</span> (a-z)</label>
        <label class="checkbox-label"><input type="checkbox" id="optNum" checked> <span data-i18n="optNum">Numbers</span> (0-9)</label>
        <label class="checkbox-label"><input type="checkbox" id="optSym" checked> <span data-i18n="optSym">Symbols</span> (!@#...)</label>
      </div>

      <button id="generateBtn" class="primary-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span data-i18n="generateBtn">Generate</span>
      </button>
    </div>

    <!-- 出力エリア -->
    <div class="output-panel">
      <input type="text" id="output" readonly data-i18n-placeholder="outputPlaceholder" placeholder="Your password will appear here">
      <button id="copyBtn" class="copy-btn" disabled data-i18n="copyBtn">Copy</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // オフライン化に失敗してもページ自体は通常どおり動作する
        });
      });
    }
  </script>
</body>
</html>
